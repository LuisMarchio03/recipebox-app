<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E8652D">
  <meta name="description" content="RecipeBox — Your online recipe book">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <title>RecipeBox</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <section id="page-login" class="page">
    <div class="login-container">
      <div class="logo">🍳</div>
      <h1>RecipeBox</h1>
      <p class="subtitle">Your online recipe book</p>
      <form id="login-form" autocomplete="off">
        <input type="text" id="username" placeholder="Usuário" required autocomplete="username">
        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
        <button type="submit">Entrar</button>
      </form>
      <p id="login-error"></p>
    </div>
  </section>

  <!-- APP MAIN -->
  <div id="app-main" style="display:none">
    <header id="app-header">
      <button id="btn-back" class="btn-icon" style="display:none" onclick="window.history.back()">←</button>
      <h1 id="header-title">RecipeBox</h1>
      <div class="header-right">
        <span id="user-name"></span>
        <button id="theme-toggle" class="theme-toggle" title="Tema">🌙</button>
        <button id="btn-logout" class="btn-icon" title="Sair">⏻</button>
      </div>
    </header>

    <div id="page-content">
      <!-- DASHBOARD -->
      <section id="page-dashboard" class="page">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar receitas..." autocomplete="off">
          <button id="search-clear" class="search-clear">✕</button>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="all">Todas</button>
          <button class="tab" data-tab="private">Privadas</button>
          <button class="tab" data-tab="group">Grupos</button>
        </div>
        <div id="recipe-list" class="recipe-list"></div>
        <button id="btn-add-recipe" class="fab" title="Nova receita">+</button>
      </section>

      <!-- RECIPE DETAIL -->
      <section id="page-recipe-detail" class="page">
        <div id="recipe-detail-content" class="recipe-detail"></div>
      </section>

      <!-- RECIPE FORM -->
      <section id="page-recipe-form" class="page">
        <h2 id="form-title">Nova Receita</h2>
        <form id="recipe-form">
          <div class="form-group">
            <label>Título *</label>
            <input type="text" id="r-title" required placeholder="Ex: Bolo de Cenoura">
            <div class="error-msg"></div>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="r-description" placeholder="Uma breve descrição...">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Tempo de Preparo (min)</label>
              <input type="number" id="r-prep-time" min="0" placeholder="20">
            </div>
            <div class="form-group">
              <label>Tempo de Cozimento (min)</label>
              <input type="number" id="r-cook-time" min="0" placeholder="40">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Porções</label>
              <input type="number" id="r-servings" min="1" value="1">
            </div>
            <div class="form-group">
              <label>Categoria</label>
              <input type="text" id="r-category" placeholder="Ex: Bolos, Carnes, Sobremesas">
            </div>
            <div class="form-group">
              <label>Dificuldade</label>
              <select id="r-difficulty">
                <option value="Fácil">Fácil</option>
                <option value="Médio" selected>Médio</option>
                <option value="Difícil">Difícil</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Ingredientes *</label>
            <textarea id="r-ingredients" required placeholder="Liste os ingredientes (um por linha)"></textarea>
            <div class="error-msg"></div>
            <div class="helper">Separe cada ingrediente em uma linha</div>
          </div>
          <div class="form-group">
            <label>Modo de Preparo *</label>
            <textarea id="r-instructions" required placeholder="Passo a passo do preparo"></textarea>
            <div class="error-msg"></div>
            <div class="helper">Descreva o passo a passo</div>
          </div>
          <div class="form-group">
            <label>Compartilhar em grupo</label>
            <select id="r-group">
              <option value="">Nenhum (Receita pessoal)</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input type="checkbox" id="r-private"> Receita Privada (só você vê)
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" id="form-submit" class="btn btn-primary">Criar</button>
            <button type="button" id="btn-form-cancel" class="btn btn-secondary">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- GROUPS -->
      <section id="page-groups" class="page">
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <button id="btn-create-group" class="btn btn-primary">➕ Novo Grupo</button>
          <button id="btn-import-excel" class="btn btn-secondary">📥 Importar Excel</button>
          <button id="btn-export-excel" class="btn btn-secondary">📤 Exportar Excel</button>
        </div>
        <div id="groups-list"></div>
      </section>

      <!-- GROUP DETAIL -->
      <section id="page-group-detail" class="page">
        <div id="group-detail-content"></div>
      </section>

      <!-- GROUP FORM -->
      <section id="page-group-form" class="page">
        <h2 id="group-form-title">Novo Grupo</h2>
        <form id="group-form">
          <div class="form-group">
            <label>Nome do Grupo *</label>
            <input type="text" id="g-name" required placeholder="Ex: Amigos do Forno">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="g-description" placeholder="Descrição do grupo..." style="min-height:80px"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Criar Grupo</button>
            <button type="button" id="btn-group-cancel" class="btn btn-secondary">Cancelar</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="#dashboard" data-page="dashboard" class="active">
    <span class="nav-icon">📖</span> Receitas
  </a>
  <a href="#groups" data-page="groups">
    <span class="nav-icon">👥</span> Grupos
  </a>
</nav>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
